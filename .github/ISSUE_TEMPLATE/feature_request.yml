name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This concerns the installer rather than a Tailscale product feature.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include safe defaults and expected command-line interface.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Security, compatibility, and rollback considerations
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
