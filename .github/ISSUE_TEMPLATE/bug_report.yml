name: Bug report
description: Report a reproducible installer problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove auth keys, login URLs, private
        tailnet names, IPs, and unrelated log data before submitting.

  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I read the troubleshooting guide.
          required: true
        - label: I searched existing issues.
          required: true
        - label: I removed all secrets and private infrastructure data.
          required: true

  - type: input
    id: installer-version
    attributes:
      label: Installer version
      description: Output of `./install.sh --version`
      placeholder: install.sh 1.0.0
    validations:
      required: true

  - type: input
    id: ubuntu-version
    attributes:
      label: Ubuntu version and codename
      placeholder: Ubuntu 22.04, jammy
    validations:
      required: true

  - type: input
    id: tailscale-version
    attributes:
      label: Tailscale version
      description: Sanitized first line of `tailscale version`, if installed

  - type: textarea
    id: command
    attributes:
      label: Sanitized command
      description: Never include an auth key or secret value.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
